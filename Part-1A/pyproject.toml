[project]
name = "lcgkit"
version = "1.0.0"
description = "Linear Congruential Generator toolkit: library, command line and stateless HTTP service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.scripts]
lcgkit = "lcgkit.cli:main"
lcgkit-serve = "lcgkit.service:serve"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.14",
    "httpx==0.28.1",
    "schemathesis==4.32.7",
    "pyyaml>=6",
    "mutmut==3.8.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcgkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90", "PL", "RUF", "D1"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "D1", "PLR2004"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ac(id): acceptance criterion the test checks",
    "fr(id): functional requirement the test checks",
    "perf: timing test with a time limit",
]

[tool.coverage.run]
branch = true
source = ["src/lcgkit"]

[tool.coverage.report]
fail_under = 95

[tool.mutmut]
source_paths = ["src/lcgkit/core/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-m", "not perf"]
also_copy = ["src/lcgkit/__init__.py", "src/lcgkit/errors.py"]
